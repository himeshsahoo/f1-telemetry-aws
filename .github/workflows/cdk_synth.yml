name: AWS CDK Synth Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - 'cdk.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'infra/**'
      - 'cdk.json'

jobs:
  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CDK Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aws-cdk-lib constructs python-dotenv

      - name: Synthesize CloudFormation Templates
        run: cdk synth
        env:
          AWS_DEFAULT_REGION: us-east-1
          F1_S3_BUCKET: f1-telemetry-synth-test
