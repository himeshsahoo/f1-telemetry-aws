[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-telemetry-aws"
version = "1.1.0"
description = "Serverless F1 Telemetry & Strategy Pipeline on AWS"
readme = "README.md"
authors = [{ name = "Himesh Sahoo" }]
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.4.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "boto3>=1.34.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
